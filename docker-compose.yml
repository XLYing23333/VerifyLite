services:
  web:
    build: .
    ports:
      - "${PORT:-1921}:1921"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      PORT: "1921"
      DATA_DIR: /app/data
      MAX_BLOB_SIZE: ${MAX_BLOB_SIZE:-1000000000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-600}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1921/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
