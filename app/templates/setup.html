{% extends "base.html" %}
{% block title %}{{ t('setup_title') }} · {{ t('brand') }}{% endblock %}
{% block auth %}
<section class="login-card">
  <h1><i class="bi bi-person-plus"></i> {{ t('setup_title') }}</h1>
  <p class="help-text">{{ t('setup_help') }}</p>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="username">{{ t('username') }}</label>
    <input class="form-control" id="username" name="username" value="{{ username }}" autocomplete="username" required minlength="3" maxlength="80">
    <label class="form-label" for="password">{{ t('password') }}</label>
    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
    <label class="form-label" for="confirm">{{ t('confirm_password') }}</label>
    <input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8">
    <button class="btn btn-primary w-100" type="submit">
      <i class="bi bi-check2"></i><span>{{ t('create_account') }}</span>
    </button>
  </form>
</section>
{% endblock %}
