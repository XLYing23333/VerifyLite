{% extends "base.html" %}
{% block title %}{{ t('account_title') }} · {{ t('brand') }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1 class="page-title"><i class="bi bi-person-gear"></i> {{ t('account_title') }}</h1>
</div>
<form method="post" class="panel form-narrow stack-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label" for="username">{{ t('username') }}</label>
  <input class="form-control" id="username" name="username" value="{{ admin_account.username }}" autocomplete="username" required minlength="3" maxlength="80">
  <label class="form-label" for="current_password">{{ t('current_password') }}</label>
  <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required>
  <label class="form-label" for="new_password">{{ t('new_password') }}</label>
  <input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" placeholder="{{ t('new_password_hint') }}">
  <label class="form-label" for="confirm">{{ t('confirm_password') }}</label>
  <input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8">
  <button class="btn btn-primary" type="submit">
    <i class="bi bi-check2"></i><span>{{ t('save') }}</span>
  </button>
</form>

<section class="panel form-narrow danger-panel">
  <h2><i class="bi bi-exclamation-octagon"></i> {{ t('format_title') }}</h2>
  <p class="help-text">{{ t('format_help') }}</p>
  <form method="post" action="{{ url_for('admin.account_format') }}" class="stack-form js-confirm-form" data-confirm="{{ t('confirm_format') }}" data-confirm-title="{{ t('format_title') }}" data-confirm-ok="{{ t('format_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="format_password">{{ t('current_password') }}</label>
    <input class="form-control" id="format_password" name="current_password" type="password" autocomplete="current-password" required>
    <button class="btn btn-outline-danger" type="submit">
      <i class="bi bi-eraser"></i><span>{{ t('format_submit') }}</span>
    </button>
  </form>
</section>
{% endblock %}
