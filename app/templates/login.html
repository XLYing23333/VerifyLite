{% extends "base.html" %}
{% block title %}{{ t('login_title') }} · {{ t('brand') }}{% endblock %}
{% block auth %}
<section class="login-card">
  <h1><i class="bi bi-shield-lock"></i> {{ t('login_title') }}</h1>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="form-label" for="username">{{ t('username') }}</label>
    <input class="form-control" id="username" name="username" autocomplete="username" required>
    <label class="form-label" for="password">{{ t('password') }}</label>
    <div class="password-field">
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="password-toggle" type="button" data-show="{{ t('show_password') }}" data-hide="{{ t('hide_password') }}" aria-label="{{ t('show_password') }}">
        <i class="bi bi-eye"></i>
      </button>
    </div>
    <button class="btn btn-primary w-100" type="submit">
      <i class="bi bi-box-arrow-in-right"></i><span>{{ t('sign_in') }}</span>
    </button>
  </form>
</section>
{% endblock %}
